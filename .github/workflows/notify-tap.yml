name: Notify Homebrew tap

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Ask the tap to bump the cask
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          gh api "repos/TT-Infinite-Archive/homebrew-tap/dispatches" \
            --method POST \
            --field event_type=release-published
